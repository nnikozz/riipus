<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Riipus Interactive</title>
    <meta charset="utf-8">
    <meta name="description" content="Games, Apps, Software.">
    <meta name="author" content="Niko Hakala">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Riipus, Riipus Interactive, Paranoia, Paranoia Game, Xelerate, Xelerate Game">
    <meta name="theme-color" content="#1b1b1b">

    <!-- Link preview -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Riipus Interactive">
    <meta property="og:title" content="Riipus Interactive">
    <meta property="og:description" content="Games, Apps, Software.">
    <meta property="og:url" content="https://riipus.com/">
    <meta property="og:image" content="https://riipus.com/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Riipus Interactive logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Riipus Interactive">
    <meta name="twitter:description" content="Games, Apps, Software.">
    <meta name="twitter:image" content="https://riipus.com/img/og-image.jpg">

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- JS check -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.riipusReady) document.documentElement.classList.remove('js');
      }, 3000);
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="img/ico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/ico/favicon-16x16.png">
    <link rel="manifest" href="img/ico/site.webmanifest">

  </head>

  <body>

    <div class="scroll-progress" aria-hidden="true"></div>

    <!-- Nav -->
    <nav class="site-nav" aria-label="Main">
      <a class="nav-brand" href="#top" aria-label="Back to top">
        <img class="norightclick" src="img/logo_white_transparent.png" alt="">
        <span>RIIPUS</span>
      </a>
      <ul class="nav-links">
        <li><a href="#games">Games</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#social">Social</a></li>
      </ul>
    </nav>

    <!-- Main -->
    <div class="hero" id="top">
      <div class="container1 hero-stage">
        <canvas class="hero-canvas" aria-hidden="true"></canvas>

        <!-- Intro Section -->
        <div class="logo-group">
          <img class="logo norightclick" src="img/logo_white_transparent.png" alt="Riipus Logo">
          <div class="text-wrapper">
            <h1><span class="logo-text">Riipus Interactive</span></h1>
          </div>
        </div>

        <div class="down-wrapper-top">
          <span class="down-arrow">
            <span class="v1">▼</span>
          </span>
        </div>

        <!-- Games Section -->
        <section class="scene scene-title" id="games">
          <div class="scene-inner">
            <span class="title-text">Games</span>
          </div>
        </section>

        <section class="scene scene-game container2">
          <div class="scene-inner games-wrapper">
            <div class="game-cover-wrapper">
              <img class="gamecover norightclick" src="img/games/coming_soon.png" alt="Xelerate cover image">
            </div>
            <div class="title">
              <h3><span class="game-name">XELERATE</span></h3>
            </div>
          </div>
        </section>

        <!-- Arrow -->
        <div class="down-wrapper down-wrapper-mid" aria-hidden="true">
          <span class="down-arrow">
            <span class="v1">▼</span>
          </span>
        </div>

        <section class="scene scene-game container2">
          <div class="scene-inner games-wrapper">
            <div class="game-cover-wrapper">
              <img class="gamecover norightclick" src="img/games/paranoia_cover_v1.png" alt="Paranoia cover image">
            </div>
            <div class="title">
              <h3><span class="game-name">PARANOIA</span></h3>
            </div>
          </div>
        </section>

        <!-- Arrow -->
        <div class="down-wrapper down-wrapper-mid" aria-hidden="true">
          <span class="down-arrow">
            <span class="v1">▼</span>
          </span>
        </div>

        <!-- Team Section -->
        <section class="scene scene-title" id="team">
          <div class="scene-inner">
            <span class="title-text">Team</span>
          </div>
        </section>

        <section class="scene scene-team container3">
          <div class="scene-inner team-wrapper">
            <div class="image">
              <img class="profilepic norightclick" src="img/xmprfl.jpg" alt="Developer Image">
            </div>
            <h2>Niko Hakala</h2>
            <span class="role">DEVELOPER</span>
          </div>
        </section>

        <!-- Arrow -->
        <div class="down-wrapper down-wrapper-mid" aria-hidden="true">
          <span class="down-arrow">
            <span class="v1">▼</span>
          </span>
        </div>

        <!-- Social Section -->
        <section class="scene scene-title" id="social">
          <div class="scene-inner">
            <span class="title-text">Social</span>
          </div>
        </section>

        <section class="scene scene-social container4">
          <div class="scene-inner">
            <div class="contact-info">

              <a href="https://www.linkedin.com/company/riipus/" aria-label="LinkedIn">
                <img class="lilogo" src="img/icons8-linkedin-logo.png" alt="LinkedIn icon">
              </a>

              <a href="mailto:riipus@protonmail.com" aria-label="Email">
                <img class="lilogo" src="img/icons8-email.png" alt="Email icon">
              </a>

              <a href="https://github.com/bidmaxxing" aria-label="GitHub">
                <img class="lilogo" src="img/icons8-github-50.png" alt="GitHub icon">
              </a>

              <a href="https://bsky.app/profile/riipus.com" aria-label="Bluesky">
                <img class="lilogo" src="img/icons8-bluesky-50.png" alt="Bsky icon">
              </a>

              <a href="https://www.tiktok.com/@riipusgames" aria-label="Tiktok">
                <img class="lilogo" src="img/icons8-tiktok-50.png" alt="Tiktok icon">
              </a>

              <a href="https://www.instagram.com/riipusgames/" aria-label="Instagram">
                <img class="lilogo" src="img/icons8-instagram.png" alt="Instagram icon">
              </a>

              <a href="https://x.com/riipusdev" aria-label="X (Twitter)">
                <img class="lilogo" src="img/icons8-xlogo.png" alt="X icon">
              </a>

              <a href="https://www.youtube.com/@riipus" aria-label="YouTube">
                <img class="lilogo" src="img/icons8-youtube-50.png" alt="YouTube icon">
              </a>

              <a href="https://discord.gg/sCnHbkwqfF" aria-label="Discord">
                <img class="lilogo" src="img/icons8-discord-new-50.png" alt="Discord icon">
              </a>

            </div>
          </div>
        </section>

        <!-- Footer -->
        <footer class="scene scene-footer site-footer">
          <div class="scene-inner">
            <p>/ 2026 / Riipus Interactive /</p>
          </div>
        </footer>

      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/hero.js"></script>
    <script>

      if (location.pathname.endsWith('index.html')) {
        const newPath = location.pathname.replace('index.html', '');
        window.history.replaceState({}, document.title, newPath);
      }

      document.addEventListener('contextmenu', e => {
        if (e.target.closest('.norightclick')) e.preventDefault();
      });

    </script>

  </body>

</html>
