<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Riipus</title>
    <meta charset="utf-8">
    <meta name="description" content="Riipus Home Page">
    <meta name="author" content="Niko Hakala">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Riipus, Riipus Interactive, Paranoia, Paranoia Game">

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Hides elements that will animate in; falls back to showing everything if scripts fail to load -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.riipusReady) document.documentElement.classList.remove('js');
      }, 3000);
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="img/ico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/ico/favicon-16x16.png">
    <link rel="manifest" href="img/ico/site.webmanifest">

  </head>

  <body>

    <div class="scroll-progress" aria-hidden="true"></div>
    <canvas class="hero-canvas" aria-hidden="true"></canvas>

    <!-- Sticky nav: slides in after the hero -->
    <nav class="site-nav" aria-label="Main">
      <a class="nav-brand" href="#top" aria-label="Back to top">
        <img class="norightclick" src="img/logo_white_transparent.png" alt="">
        <span>RIIPUS</span>
      </a>
      <ul class="nav-links">
        <li><a href="#games">Games</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#social">Social</a></li>
      </ul>
    </nav>

    <div class="main">

      <!-- Intro Section -->
      <div class="container1" id="top">
        <div class="logo-group">
          <img class="logo norightclick" src="img/logo_white_transparent.png" alt="Riipus Logo">
          <div class="text-wrapper">
            <h1><span class="logo-text">Riipus Interactive</span></h1>
          </div>
        </div>


        <div class="down-wrapper-top">
          <span class="down-arrow">
            <span class="v1">▼</span>
          </span>
        </div>

      </div>

      <!-- Games Section -->
      <div class="container2" id="games" data-section="games">
        <div class="games-wrapper">
          <span class="title-text">Games</span>

          <div class="game-cover-wrapper" data-reveal="scale">
            <img class="gamecover norightclick" src="img/games/coming_soon.png" alt="paranoia cover image"></img>
          </div>

          <div class="title" data-reveal>
            <h3><span class="game-name">XELERATE</span></h3>
          </div>
        </div>
      </div>

      <div class="down-wrapper" data-reveal>
        <span class="down-arrow">
          <span class="v1">▼</span>
        </span>
      </div>

      <div class="container2" data-section="games">
        <div class="games-wrapper">

          <div class="game-cover-wrapper" data-reveal="scale">
            <img class="gamecover norightclick" src="img/games/paranoia_cover_v1.png" alt="paranoia cover image"></img>
          </div>

          <div class="title" data-reveal>
            <h3><span class="game-name">PARANOIA</span></h3>
          </div>
        </div>
      </div>

      <div class="down-wrapper" data-reveal>
        <span class="down-arrow">
          <span class="v1">▼</span>
        </span>
      </div>

      <!-- Team Section -->
      <div class="container3" id="team" data-section="team">
        <div class="team-wrapper">
          <span class="title-text">Team</span>

          <div class="image" data-reveal="clip">
            <img class="profilepic norightclick" src="img/xmprfl.jpg" alt="Developer Image"></img>
          </div>

          <h2 data-reveal="left">Niko Hakala</h2>
          <span class="role" data-reveal="right">DEVELOPER</span>
        </div>
      </div>

      <div class="down-wrapper" data-reveal>
        <span class="down-arrow">
          <span class="v1">▼</span>
        </span>
      </div>

      <!-- Social Section -->
      <div class="container4" id="social" data-section="social">
        <span class="title-text">Social</span>

        <div class="contact-info" data-reveal="stagger">

          <a href="https://www.linkedin.com/company/riipus/" aria-label="LinkedIn">
            <img class="lilogo" src="img/icons8-linkedin-logo.png" alt="LinkedIn icon">
          </a>

          <a href="mailto:riipus@protonmail.com" aria-label="Email">
            <img class="lilogo" src="img/icons8-email.png" alt="Email icon">
          </a>

          <a href="https://bsky.app/profile/riipus.com" aria-label="Bluesky">
            <img class="lilogo" src="img/icons8-bluesky-50.png" alt="Bsky icon">
          </a>

          <a href="https://www.tiktok.com/@riipusgames" aria-label="Tiktok">
            <img class="lilogo" src="img/icons8-tiktok-50.png" alt="Tiktok icon">
          </a>

          <a href="https://www.instagram.com/riipusgames/" aria-label="Instagram">
            <img class="lilogo" src="img/icons8-instagram.png" alt="Instagram icon">
          </a>

          <a href="https://x.com/riipusdev" aria-label="X (Twitter)">
            <img class="lilogo" src="img/icons8-xlogo.png" alt="X icon">
          </a>

          <a href="https://www.youtube.com/@riipus" aria-label="YouTube">
            <img class="lilogo" src="img/icons8-youtube.png" alt="YouTube icon">
          </a>

          <a href="https://discord.gg/sCnHbkwqfF" aria-label="Discord">
            <img class="lilogo" src="img/icons8-discord-logo.png" alt="Discord icon">
          </a>

        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer" data-reveal>
      <p>/ 2026 / Riipus Interactive /</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/hero.js"></script>
    <script>

      if (location.pathname.endsWith('index.html')) {
        const newPath = location.pathname.replace('index.html', '');
        window.history.replaceState({}, document.title, newPath);
      }

      document.addEventListener('contextmenu', e => {
        if (e.target.closest('.norightclick')) e.preventDefault();
      });

    </script>

  </body>

</html>
